<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#000000" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="manifest.json" />
    <link
      rel="apple-touch-icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%231a1a1a'/%3E%3Cstop offset='1' stop-color='%23000000'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='512' height='512' rx='110' fill='url(%23g)'/%3E%3Ccircle cx='256' cy='256' r='150' fill='%230f0f0f' stroke='%232d2d2d' stroke-width='18'/%3E%3Ccircle cx='256' cy='256' r='74' fill='%231b1b1b' stroke='%234a4a4a' stroke-width='10'/%3E%3Ccircle cx='320' cy='206' r='16' fill='%237ae1ff'/%3E%3C/svg%3E"
    />
    <title>Silencio Camera</title>
    <style>
      :root {
        color-scheme: dark;
        --ink: #f7f7f7;
        --muted: rgba(255, 255, 255, 0.68);
        --dim: rgba(255, 255, 255, 0.4);
        --glass: rgba(18, 18, 18, 0.65);
        --glass-strong: rgba(10, 10, 10, 0.78);
        --glass-border: rgba(255, 255, 255, 0.12);
        --accent: #f3c24a;
        --accent-ink: #1b1600;
        --danger: #ff6b6b;
        --safe-top: env(safe-area-inset-top, 0px);
        --safe-bottom: env(safe-area-inset-bottom, 0px);
        --safe-left: env(safe-area-inset-left, 0px);
        --safe-right: env(safe-area-inset-right, 0px);
        --edge-left: calc(16px + var(--safe-left));
        --edge-right: calc(16px + var(--safe-right));
        --bar-top: var(--safe-top);
        --bar-bottom: var(--safe-bottom);
        --bar-color: #000000;
      }

      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }

      html,
      body {
        height: 100%;
        overscroll-behavior: none;
      }

      body {
        margin: 0;
        font-family: "SF Pro Text", "SF Pro Display", -apple-system, "Helvetica Neue", Helvetica, sans-serif;
        background: radial-gradient(120% 120% at 50% -10%, #1b1b1b 0%, #070707 55%, #000 100%);
        color: var(--ink);
        overflow: hidden;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
      }

      .app {
        position: relative;
        width: 100vw;
        height: 100vh;
        height: 100svh;
        animation: appFade 0.7s ease both;
      }

      .camera-stage {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
        touch-action: none;
      }

      body.standalone {
        --bar-top: max(var(--safe-top), 24px);
        --bar-bottom: max(var(--safe-bottom), 24px);
      }

      body.standalone .camera-stage::before,
      body.standalone .camera-stage::after {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        background: var(--bar-color);
        pointer-events: none;
        z-index: 3;
      }

      body.standalone .camera-stage::before {
        top: 0;
        height: var(--bar-top);
      }

      body.standalone .camera-stage::after {
        bottom: 0;
        height: var(--bar-bottom);
      }

      video {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        background: #000;
        transform: scale(1);
        opacity: 0;
        transition: opacity 0.2s ease, transform 0.25s ease;
      }

      .camera-stage.ready video {
        opacity: 1;
      }

      .vignette {
        position: absolute;
        inset: 0;
        background: radial-gradient(circle at center, rgba(0, 0, 0, 0) 40%, rgba(0, 0, 0, 0.42) 100%);
        pointer-events: none;
      }

      .grid-overlay {
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(to right, rgba(255, 255, 255, 0.32) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(255, 255, 255, 0.32) 1px, transparent 1px);
        background-size: 33.333% 33.333%;
        opacity: 0.5;
        pointer-events: none;
      }

      .grid-overlay.hidden {
        display: none;
      }

      .focus-ring {
        position: absolute;
        width: 90px;
        height: 90px;
        border-radius: 50%;
        border: 2px solid rgba(255, 214, 90, 0.95);
        box-shadow: 0 0 12px rgba(243, 194, 74, 0.6);
        transform: translate(-50%, -50%) scale(0.7);
        opacity: 0;
        pointer-events: none;
      }

      .focus-ring.active {
        animation: focusPop 1.1s ease forwards;
      }

      .top-ui {
        position: absolute;
        inset: 0 0 auto 0;
        padding: calc(10px + var(--bar-top)) var(--edge-right) 0 var(--edge-left);
        display: flex;
        align-items: center;
        justify-content: space-between;
        pointer-events: none;
      }

      .top-left {
        display: flex;
        align-items: center;
        gap: 8px;
        pointer-events: auto;
      }

      .badge {
        font-size: 12px;
        letter-spacing: 0.2em;
        color: var(--muted);
        text-transform: uppercase;
        padding: 6px 10px;
        border-radius: 999px;
        background: rgba(0, 0, 0, 0.35);
        border: 1px solid rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(10px);
      }


      .top-right {
        display: flex;
        gap: 8px;
        padding: 6px 10px;
        border-radius: 999px;
        background: var(--glass);
        border: 1px solid var(--glass-border);
        backdrop-filter: blur(18px);
        pointer-events: auto;
      }

      .icon-btn {
        width: 36px;
        height: 36px;
        border: none;
        border-radius: 999px;
        background: rgba(0, 0, 0, 0.35);
        display: grid;
        place-items: center;
        color: var(--ink);
        cursor: pointer;
        transition: transform 0.2s ease, background 0.2s ease;
      }

      .icon-btn svg {
        width: 18px;
        height: 18px;
        fill: currentColor;
      }

      .icon-btn.active {
        color: var(--accent-ink);
        background: var(--accent);
      }

      .icon-btn:active {
        transform: scale(0.92);
      }

      .bottom-ui {
        position: absolute;
        inset: auto 0 0 0;
        padding: 0 var(--edge-right) calc(6px + var(--bar-bottom)) var(--edge-left);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        pointer-events: none;
      }

      .zoom-row {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 6px 12px;
        background: var(--glass);
        border: 1px solid var(--glass-border);
        border-radius: 999px;
        backdrop-filter: blur(16px);
        pointer-events: auto;
      }

      .zoom-row.disabled {
        opacity: 0.5;
      }

      .zoom-chip {
        min-width: 48px;
        height: 32px;
        border-radius: 999px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        background: rgba(0, 0, 0, 0.3);
        color: var(--ink);
        font-size: 14px;
        font-weight: 600;
        display: grid;
        place-items: center;
        cursor: pointer;
        transition: transform 0.2s ease, background 0.2s ease, color 0.2s ease;
      }

      .zoom-chip.active {
        background: var(--accent);
        color: var(--accent-ink);
      }

      .zoom-chip:disabled {
        cursor: not-allowed;
        opacity: 0.5;
      }

      .zoom-hint {
        font-size: 11px;
        color: var(--dim);
        letter-spacing: 0.2em;
        text-transform: uppercase;
        padding-left: 6px;
      }

      .zoom-hint.hidden {
        display: none;
      }

      .controls-row {
        width: 100%;
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: center;
        pointer-events: auto;
      }

      .thumb {
        width: 54px;
        height: 54px;
        justify-self: start;
        border-radius: 16px;
        border: 2px solid rgba(255, 255, 255, 0.2);
        background: rgba(0, 0, 0, 0.4);
        position: relative;
        overflow: hidden;
        display: grid;
        place-items: center;
        cursor: pointer;
      }

      .thumb img {
        position: absolute;
        inset: -8%;
        width: 116%;
        height: 116%;
        object-fit: cover;
        display: block;
        opacity: 0;
        transition: opacity 0.25s ease;
      }

      .thumb.has-image img {
        opacity: 1;
      }

      .thumb.has-image {
        border-color: transparent;
        background: transparent;
      }

      .thumb.has-image .thumb-placeholder {
        display: none;
      }

      .thumb-placeholder {
        width: 70%;
        height: 70%;
        border-radius: 12px;
        border: 1px solid rgba(255, 255, 255, 0.2);
        background: linear-gradient(135deg, rgba(255, 255, 255, 0.08), rgba(255, 255, 255, 0));
      }

      .shutter-btn {
        width: 86px;
        height: 86px;
        justify-self: center;
        border-radius: 50%;
        border: 4px solid rgba(255, 255, 255, 0.45);
        background: #ffffff;
        box-shadow: 0 10px 22px rgba(0, 0, 0, 0.4);
        cursor: pointer;
        position: relative;
        transition: transform 0.15s ease;
      }

      .shutter-btn.landscape {
        display: none;
      }

      .shutter-btn:active {
        transform: scale(0.94);
      }

      .switch-btn {
        width: 54px;
        height: 54px;
        justify-self: end;
        border-radius: 50%;
        border: 1px solid rgba(255, 255, 255, 0.22);
        background: rgba(0, 0, 0, 0.4);
        color: var(--ink);
        display: grid;
        place-items: center;
        cursor: pointer;
      }

      .switch-btn svg {
        width: 22px;
        height: 22px;
        fill: currentColor;
      }


      .boot-overlay {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        background: linear-gradient(180deg, rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.9));
        backdrop-filter: blur(8px);
        z-index: 5;
      }

      .boot-overlay.hidden {
        display: none;
      }

      .boot-card {
        text-align: center;
        padding: 28px 26px;
        border-radius: 22px;
        background: rgba(10, 10, 10, 0.75);
        border: 1px solid rgba(255, 255, 255, 0.12);
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        width: min(320px, 90vw);
      }

      .boot-title {
        font-size: 20px;
        font-weight: 600;
        letter-spacing: 0.08em;
      }

      .boot-sub {
        font-size: 14px;
        color: var(--muted);
        margin: 8px 0 18px;
      }

      .start-btn {
        width: 100%;
        padding: 12px 16px;
        border-radius: 999px;
        border: none;
        background: var(--accent);
        color: var(--accent-ink);
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        cursor: pointer;
      }

      .boot-note {
        margin-top: 12px;
        font-size: 12px;
        color: var(--dim);
      }

      .error-banner {
        position: absolute;
        top: calc(56px + var(--bar-top));
        left: 50%;
        transform: translateX(-50%);
        background: rgba(20, 0, 0, 0.72);
        color: #ffd1d1;
        padding: 10px 16px;
        border-radius: 999px;
        border: 1px solid rgba(255, 107, 107, 0.5);
        font-size: 12px;
        z-index: 6;
        backdrop-filter: blur(12px);
      }

      .error-banner.hidden {
        display: none;
      }

      .preview-overlay {
        position: absolute;
        inset: 0;
        background: rgba(0, 0, 0, 0.92);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        z-index: 7;
      }

      .preview-overlay.hidden {
        display: none;
      }

      .preview-overlay img {
        max-width: 92vw;
        max-height: 70vh;
        border-radius: 16px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      }

      .preview-controls {
        display: flex;
        gap: 12px;
      }

      .action-btn {
        padding: 12px 18px;
        border-radius: 999px;
        border: none;
        background: var(--accent);
        color: var(--accent-ink);
        font-weight: 600;
        text-decoration: none;
        cursor: pointer;
      }

      .action-btn.ghost {
        background: rgba(255, 255, 255, 0.12);
        color: var(--ink);
      }

      .preview-note {
        font-size: 12px;
        color: var(--dim);
      }

      .shutter-flash {
        position: absolute;
        inset: 0;
        background: rgba(255, 255, 255, 0.9);
        opacity: 0;
        pointer-events: none;
      }

      .shutter-flash.active {
        animation: shutterFlash 0.18s ease forwards;
      }

      .capture-canvas {
        display: none;
      }

      @keyframes shutterFlash {
        0% {
          opacity: 0;
        }
        40% {
          opacity: 1;
        }
        100% {
          opacity: 0;
        }
      }

      @keyframes focusPop {
        0% {
          transform: translate(-50%, -50%) scale(0.7);
          opacity: 0;
        }
        30% {
          transform: translate(-50%, -50%) scale(1);
          opacity: 1;
        }
        100% {
          transform: translate(-50%, -50%) scale(1.1);
          opacity: 0;
        }
      }

      @keyframes appFade {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      @media (min-width: 820px) {
        .top-right {
          padding: 8px 14px;
          gap: 10px;
        }

        .zoom-row {
          gap: 14px;
        }

        .shutter-btn {
          width: 94px;
          height: 94px;
        }
      }

      @media (orientation: landscape) {
        .bottom-ui {
          width: 100%;
          padding: 0;
          gap: 0;
          display: block;
        }

        .controls-row {
          position: absolute;
          left: 0;
          right: 0;
          bottom: calc(8px + var(--bar-bottom));
          display: flex;
          align-items: center;
          justify-content: space-between;
          padding: 0 var(--edge-right) 0 var(--edge-left);
          pointer-events: none;
          z-index: 2;
        }

        .controls-row > button {
          pointer-events: auto;
        }

        .controls-row .shutter-btn {
          display: none;
        }

        .zoom-row {
          position: absolute;
          left: 50%;
          transform: translateX(-50%);
          bottom: calc(8px + var(--bar-bottom));
          z-index: 3;
        }

        .shutter-btn.landscape {
          display: block;
          position: absolute;
          right: calc(16px + var(--safe-right));
          top: 50%;
          transform: translateY(-50%);
          z-index: 4;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        * {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <div class="camera-stage" id="stage">
        <video id="camera" autoplay playsinline muted></video>
        <div id="gridOverlay" class="grid-overlay hidden"></div>
        <div class="vignette"></div>
        <div id="focusRing" class="focus-ring"></div>
        <div id="shutterFlash" class="shutter-flash"></div>
        <canvas id="captureCanvas" class="capture-canvas" aria-hidden="true"></canvas>

        <div class="top-ui">
          <div class="top-left">
            <span class="badge">SILENT</span>
          </div>
          <div class="top-right">
            <button id="gridToggle" class="icon-btn" aria-label="Grid" aria-pressed="false">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path
                  d="M3 3h8v8H3V3zm10 0h8v8h-8V3zM3 13h8v8H3v-8zm10 0h8v8h-8v-8z"
                />
              </svg>
            </button>
          </div>
        </div>

        <div class="bottom-ui">
          <div class="zoom-row" id="zoomRow">
            <button class="zoom-chip" data-zoom="0.5">.5x</button>
            <button class="zoom-chip active" data-zoom="1">1x</button>
            <button class="zoom-chip" data-zoom="2">2x</button>
            <button class="zoom-chip" data-zoom="3">3x</button>
            <span id="zoomHint" class="zoom-hint hidden">Digital</span>
          </div>

          <div class="controls-row">
            <button id="thumbBtn" class="thumb" aria-label="Last photo">
              <img id="thumbImg" alt="" />
            </button>
            <button id="shutterBtn" class="shutter-btn" aria-label="Shutter"></button>
            <button id="switchBtn" class="switch-btn" aria-label="Switch camera">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path
                  d="M7 7h6V4l4 4-4 4V9H7V7zm10 10H11v3l-4-4 4-4v3h6v2z"
                />
              </svg>
            </button>
          </div>

        </div>

        <button
          id="shutterBtnLandscape"
          class="shutter-btn landscape"
          aria-label="Shutter"
        ></button>

        <div id="bootOverlay" class="boot-overlay">
          <div class="boot-card">
            <div class="boot-title">Silencio Camera</div>
            <div class="boot-sub">Tap to start the camera</div>
            <button id="startBtn" class="start-btn">Start Camera</button>
            <div class="boot-note">Requires HTTPS and camera access</div>
          </div>
        </div>

        <div id="errorBanner" class="error-banner hidden" role="alert"></div>

        <div id="previewOverlay" class="preview-overlay hidden" aria-hidden="true">
          <img id="previewImage" alt="Captured photo preview" />
          <div class="preview-controls">
            <a id="downloadBtn" class="action-btn" href="#" download>Save Photo</a>
            <button id="closePreview" class="action-btn ghost">Close</button>
          </div>
          <div class="preview-note">If Save does not work, tap and hold the photo to save.</div>
        </div>
      </div>
    </div>

    <script>
      const elements = {
        stage: document.getElementById("stage"),
        video: document.getElementById("camera"),
        gridOverlay: document.getElementById("gridOverlay"),
        focusRing: document.getElementById("focusRing"),
        shutterFlash: document.getElementById("shutterFlash"),
        canvas: document.getElementById("captureCanvas"),
        bootOverlay: document.getElementById("bootOverlay"),
        startBtn: document.getElementById("startBtn"),
        errorBanner: document.getElementById("errorBanner"),
        gridToggle: document.getElementById("gridToggle"),
        zoomRow: document.getElementById("zoomRow"),
        zoomHint: document.getElementById("zoomHint"),
        zoomButtons: Array.from(document.querySelectorAll(".zoom-chip")),
        thumbBtn: document.getElementById("thumbBtn"),
        thumbImg: document.getElementById("thumbImg"),
        shutterBtn: document.getElementById("shutterBtn"),
        shutterBtnLandscape: document.getElementById("shutterBtnLandscape"),
        switchBtn: document.getElementById("switchBtn"),
        previewOverlay: document.getElementById("previewOverlay"),
        previewImage: document.getElementById("previewImage"),
        downloadBtn: document.getElementById("downloadBtn"),
        closePreview: document.getElementById("closePreview"),
      };

      const state = {
        stream: null,
        track: null,
        facingMode: "environment",
        zoom: 1,
        zoomCaps: null,
        canZoom: false,
        usingSimulatedZoom: false,
        lastCaptureUrl: null,
        lastCaptureBlob: null,
        shutterBusy: false,
        pinchActive: false,
        pinchStartDistance: 0,
        pinchStartZoom: 1,
        pinchRaf: 0,
        pendingZoom: null,
        lastDeviceId: null,
        lastFacingMode: null,
        deviceFacingMap: {},
      };

      const zoomSteps = [0.5, 1, 2, 3];
      const BOOT_SEEN_KEY = "silencio_boot_seen";
      const isAndroid = /Android/i.test(navigator.userAgent);

      const isStandaloneDisplay =
        (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) ||
        window.navigator.standalone === true;
      if (isStandaloneDisplay) {
        document.body.classList.add("standalone");
      }

      function hasBootSeen() {
        try {
          return localStorage.getItem(BOOT_SEEN_KEY) === "1";
        } catch (error) {
          return false;
        }
      }

      function setBootSeen() {
        try {
          localStorage.setItem(BOOT_SEEN_KEY, "1");
        } catch (error) {
          // Ignore storage failures (private browsing, quotas, etc.).
        }
      }

      function getZoomLimits() {
        if (state.canZoom && state.zoomCaps) {
          const min = typeof state.zoomCaps.min === "number" ? state.zoomCaps.min : 0.5;
          const max = typeof state.zoomCaps.max === "number" ? state.zoomCaps.max : 3;
          return { min, max };
        }

        return { min: 0.5, max: 3 };
      }

      function getPinchDistance(touches) {
        const [first, second] = touches;
        const dx = first.clientX - second.clientX;
        const dy = first.clientY - second.clientY;
        return Math.hypot(dx, dy);
      }

      function inferFacingFromLabel(label) {
        if (!label) {
          return null;
        }

        if (/front|user|face/i.test(label)) {
          return "user";
        }

        if (/back|rear|environment/i.test(label)) {
          return "environment";
        }

        return null;
      }

      async function listVideoDevices() {
        if (!navigator.mediaDevices || !navigator.mediaDevices.enumerateDevices) {
          return [];
        }

        try {
          const devices = await navigator.mediaDevices.enumerateDevices();
          return devices.filter((device) => device.kind === "videoinput");
        } catch (error) {
          return [];
        }
      }

      function findDeviceByLabel(devices, facingMode) {
        if (!devices.length) {
          return null;
        }

        return (
          devices.find((device) => inferFacingFromLabel(device.label) === facingMode) || null
        );
      }

      async function findAlternateDeviceId(currentDeviceId, facingMode) {
        const devices = await listVideoDevices();
        if (devices.length < 2) {
          return null;
        }

        const knownMatch = devices.find(
          (device) =>
            device.deviceId &&
            device.deviceId !== currentDeviceId &&
            state.deviceFacingMap[device.deviceId] === facingMode
        );
        if (knownMatch) {
          return knownMatch.deviceId;
        }

        const labeled = findDeviceByLabel(devices, facingMode);
        if (labeled && labeled.deviceId && labeled.deviceId !== currentDeviceId) {
          return labeled.deviceId;
        }

        const fallback = devices.find(
          (device) => device.deviceId && device.deviceId !== currentDeviceId
        );
        return fallback ? fallback.deviceId : null;
      }

      function scheduleZoom(value) {
        state.pendingZoom = value;
        if (state.pinchRaf) {
          return;
        }

        state.pinchRaf = requestAnimationFrame(() => {
          state.pinchRaf = 0;
          if (typeof state.pendingZoom === "number") {
            void applyZoom(state.pendingZoom);
          }
        });
      }

      function updateVideoTransform() {
        const baseScale = state.usingSimulatedZoom ? state.zoom : 1;
        const flip = state.facingMode === "user" ? -1 : 1;
        elements.video.style.transform = `scaleX(${flip}) scale(${baseScale})`;
      }

      function markVideoReady() {
        elements.stage.classList.add("ready");
      }

      function showError(message) {
        elements.errorBanner.textContent = message;
        elements.errorBanner.classList.remove("hidden");
      }

      function clearError() {
        elements.errorBanner.classList.add("hidden");
      }

      function setBootVisible(visible) {
        elements.bootOverlay.classList.toggle("hidden", !visible);
      }

      function stopCamera() {
        if (state.stream) {
          state.stream.getTracks().forEach((track) => track.stop());
        }
        state.stream = null;
        state.track = null;
        state.canZoom = false;
        state.zoomCaps = null;
        state.usingSimulatedZoom = false;
        state.pinchActive = false;
        state.pinchStartDistance = 0;
        elements.stage.classList.remove("ready");
      }

      async function startCamera(preferredDeviceId = null, allowFallback = true) {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          showError("Camera API is not available in this browser.");
          return;
        }

        const requestedFacingMode = state.facingMode;
        const previousFacingMode = state.lastFacingMode;
        const previousDeviceId = state.lastDeviceId;

        clearError();
        stopCamera();
        void lockPortraitOrientation();

        const videoConstraints = {
          width: { ideal: 1920 },
          height: { ideal: 1080 },
        };

        if (preferredDeviceId) {
          videoConstraints.deviceId = { exact: preferredDeviceId };
        } else {
          videoConstraints.facingMode = { ideal: requestedFacingMode };
        }

        const constraints = {
          audio: false,
          video: videoConstraints,
        };

        try {
          const stream = await navigator.mediaDevices.getUserMedia(constraints);
          state.stream = stream;
          elements.video.srcObject = stream;
          await elements.video.play();

          if (elements.video.readyState >= 2) {
            markVideoReady();
          } else {
            elements.video.addEventListener("loadeddata", markVideoReady, { once: true });
          }

          const [track] = stream.getVideoTracks();
          state.track = track || null;

          const settings = track && track.getSettings ? track.getSettings() : {};
          const currentDeviceId = settings.deviceId || null;
          let currentFacingMode = settings.facingMode || null;
          const inferredFacingMode = inferFacingFromLabel(track && track.label ? track.label : "");
          if (!currentFacingMode && inferredFacingMode) {
            currentFacingMode = inferredFacingMode;
          }

          if (currentDeviceId && currentFacingMode) {
            state.deviceFacingMap[currentDeviceId] = currentFacingMode;
          }

          if (currentFacingMode) {
            state.facingMode = currentFacingMode;
          }

          state.lastDeviceId = currentDeviceId;
          state.lastFacingMode = currentFacingMode || requestedFacingMode;

          if (isAndroid && allowFallback) {
            const switchedFacing = previousFacingMode && previousFacingMode !== requestedFacingMode;
            const deviceDidNotChange =
              previousDeviceId && currentDeviceId && previousDeviceId === currentDeviceId;
            const facingMismatch = currentFacingMode && currentFacingMode !== requestedFacingMode;

            if (switchedFacing && (facingMismatch || deviceDidNotChange)) {
              const alternateDeviceId = await findAlternateDeviceId(
                currentDeviceId,
                requestedFacingMode
              );
              if (alternateDeviceId) {
                return startCamera(alternateDeviceId, false);
              }
            }
          }

          const caps = track && track.getCapabilities ? track.getCapabilities() : null;
          if (caps && caps.zoom) {
            state.canZoom = true;
            state.zoomCaps = caps.zoom;
            state.usingSimulatedZoom = false;
          } else {
            state.canZoom = false;
            state.zoomCaps = null;
            state.usingSimulatedZoom = true;
          }

          await applyZoom(state.zoom);
          updateZoomUI();
          setBootVisible(false);
        } catch (error) {
          stopCamera();
          showError("Camera access was blocked or unavailable.");
          setBootVisible(true);
        }
      }

      async function applyZoom(value) {
        state.zoom = value;

        if (state.track && state.canZoom && typeof state.track.applyConstraints === "function") {
          const min = state.zoomCaps && typeof state.zoomCaps.min === "number" ? state.zoomCaps.min : 1;
          const max = state.zoomCaps && typeof state.zoomCaps.max === "number" ? state.zoomCaps.max : value;
          const clamped = Math.min(max, Math.max(min, value));

          state.zoom = clamped;

          try {
            await state.track.applyConstraints({
              advanced: [{ zoom: clamped }],
            });
            state.usingSimulatedZoom = false;
          } catch (error) {
            state.canZoom = false;
            state.usingSimulatedZoom = true;
          }
        }

        if (state.usingSimulatedZoom) {
          updateVideoTransform();
        } else {
          updateVideoTransform();
        }

        updateZoomUI();
      }

      function updateZoomUI() {
        const nearest = zoomSteps.reduce((prev, current) => {
          return Math.abs(current - state.zoom) < Math.abs(prev - state.zoom) ? current : prev;
        }, zoomSteps[0]);

        elements.zoomButtons.forEach((button) => {
          const value = Number(button.dataset.zoom || 1);
          button.classList.toggle("active", value === nearest);
          button.disabled = !state.stream;
        });

        elements.zoomHint.classList.toggle("hidden", !state.usingSimulatedZoom);
        elements.zoomRow.classList.toggle("disabled", !state.stream);
      }

      function triggerFocusRing(event) {
        if (!state.stream) {
          return;
        }

        if (event.target.closest("button") || event.target.closest("a")) {
          return;
        }

        const rect = elements.stage.getBoundingClientRect();
        const x = event.clientX - rect.left;
        const y = event.clientY - rect.top;

        elements.focusRing.style.left = `${x}px`;
        elements.focusRing.style.top = `${y}px`;
        elements.focusRing.classList.remove("active");
        void elements.focusRing.offsetWidth;
        elements.focusRing.classList.add("active");
      }

      function triggerFlash() {
        elements.shutterFlash.classList.remove("active");
        void elements.shutterFlash.offsetWidth;
        elements.shutterFlash.classList.add("active");
      }

      async function lockPortraitOrientation() {
        if (!screen.orientation || typeof screen.orientation.lock !== "function") {
          return;
        }

        try {
          await screen.orientation.lock("portrait");
        } catch (error) {
          // Orientation lock is best-effort and may be blocked by the browser.
        }
      }

      function dataUrlToBlob(dataUrl) {
        if (!dataUrl) {
          return null;
        }

        const parts = dataUrl.split(",");
        if (parts.length < 2) {
          return null;
        }

        const match = parts[0].match(/:(.*?);/);
        const mime = match ? match[1] : "image/jpeg";
        const binary = atob(parts[1]);
        const length = binary.length;
        const bytes = new Uint8Array(length);

        for (let i = 0; i < length; i += 1) {
          bytes[i] = binary.charCodeAt(i);
        }

        return new Blob([bytes], { type: mime });
      }

      function handlePinchStart(event) {
        if (!state.stream) {
          return;
        }

        if (event.touches.length === 2) {
          event.preventDefault();
          state.pinchActive = true;
          state.pinchStartDistance = getPinchDistance(event.touches);
          state.pinchStartZoom = state.zoom;
        }
      }

      function handlePinchMove(event) {
        if (!state.pinchActive || event.touches.length !== 2) {
          return;
        }

        event.preventDefault();

        const distance = getPinchDistance(event.touches);
        if (!state.pinchStartDistance) {
          return;
        }

        const scale = distance / state.pinchStartDistance;
        const limits = getZoomLimits();
        const targetZoom = Math.min(limits.max, Math.max(limits.min, state.pinchStartZoom * scale));
        scheduleZoom(targetZoom);
      }

      function handlePinchEnd(event) {
        if (event.touches.length < 2) {
          state.pinchActive = false;
          state.pinchStartDistance = 0;
        }
      }

      function openPreview(url) {
        elements.previewImage.src = url;
        elements.downloadBtn.href = url;
        elements.downloadBtn.download = `silencio-${Date.now()}.jpg`;
        elements.previewOverlay.classList.remove("hidden");
        elements.previewOverlay.setAttribute("aria-hidden", "false");
      }

      function closePreview() {
        elements.previewOverlay.classList.add("hidden");
        elements.previewOverlay.setAttribute("aria-hidden", "true");
      }

      function capturePhoto() {
        if (!state.stream || state.shutterBusy) {
          return;
        }

        if (elements.video.readyState < 2) {
          showError("Camera is still warming up.");
          return;
        }

        state.shutterBusy = true;

        const width = elements.video.videoWidth;
        const height = elements.video.videoHeight;
        const context = elements.canvas.getContext("2d");

        elements.canvas.width = width;
        elements.canvas.height = height;
        context.save();
        if (state.facingMode === "user") {
          context.translate(width, 0);
          context.scale(-1, 1);
        }
        context.drawImage(elements.video, 0, 0, width, height);
        context.restore();

        triggerFlash();

        const dataUrl = elements.canvas.toDataURL("image/jpeg", 0.92);
        const blob = dataUrlToBlob(dataUrl);

        if (!blob) {
          state.shutterBusy = false;
          showError("Failed to capture photo.");
          return;
        }

        if (state.lastCaptureUrl) {
          URL.revokeObjectURL(state.lastCaptureUrl);
        }
        state.lastCaptureBlob = blob;

        const url = URL.createObjectURL(blob);
        state.lastCaptureUrl = url;

        elements.thumbImg.src = url;
        elements.thumbBtn.classList.add("has-image");

        const file = new File([blob], `silencio-${Date.now()}.jpg`, {
          type: blob.type || "image/jpeg",
        });
        const shareData = {
          files: [file],
          title: "Silencio Photo",
        };

        let canShare = false;
        if (navigator.share) {
          try {
            canShare = navigator.canShare ? navigator.canShare(shareData) : true;
          } catch (error) {
            canShare = false;
          }
        }

        if (canShare) {
          navigator
            .share(shareData)
            .catch((error) => {
              if (error && error.name === "AbortError") {
                return;
              }
              openPreview(url);
            })
            .finally(() => {
              state.shutterBusy = false;
            });
        } else {
          openPreview(url);
          state.shutterBusy = false;
        }
      }

      function toggleButton(button) {
        const nextState = !button.classList.contains("active");
        button.classList.toggle("active", nextState);
        button.setAttribute("aria-pressed", String(nextState));
      }

      async function shareCaptureFromPreview(event) {
        if (!state.lastCaptureBlob || !navigator.share) {
          return;
        }

        const file = new File([state.lastCaptureBlob], `silencio-${Date.now()}.jpg`, {
          type: state.lastCaptureBlob.type || "image/jpeg",
        });
        const shareData = {
          files: [file],
          title: "Silencio Photo",
        };

        let canShare = true;
        if (navigator.canShare) {
          try {
            canShare = navigator.canShare(shareData);
          } catch (error) {
            canShare = false;
          }
        }

        if (!canShare) {
          return;
        }

        event.preventDefault();

        try {
          await navigator.share(shareData);
        } catch (error) {
          if (error && error.name === "AbortError") {
            return;
          }
        }
      }

      elements.startBtn.addEventListener("click", () => {
        setBootSeen();
        void lockPortraitOrientation();
        startCamera();
      });
      elements.shutterBtn.addEventListener("click", capturePhoto);
      elements.shutterBtnLandscape.addEventListener("click", capturePhoto);
      elements.thumbBtn.addEventListener("click", () => {
        if (state.lastCaptureUrl) {
          openPreview(state.lastCaptureUrl);
        }
      });
      elements.closePreview.addEventListener("click", closePreview);
      elements.downloadBtn.addEventListener("click", (event) => {
        void shareCaptureFromPreview(event);
      });
      elements.switchBtn.addEventListener("click", async () => {
        state.facingMode = state.facingMode === "environment" ? "user" : "environment";
        await startCamera();
      });

      elements.zoomButtons.forEach((button) => {
        button.addEventListener("click", () => {
          const value = Number(button.dataset.zoom || 1);
          void applyZoom(value);
        });
      });

      elements.gridToggle.addEventListener("click", () => {
        toggleButton(elements.gridToggle);
        elements.gridOverlay.classList.toggle("hidden", !elements.gridToggle.classList.contains("active"));
      });

      elements.stage.addEventListener("pointerdown", triggerFocusRing);
      elements.stage.addEventListener("touchstart", handlePinchStart, { passive: false });
      elements.stage.addEventListener("touchmove", handlePinchMove, { passive: false });
      elements.stage.addEventListener("touchend", handlePinchEnd, { passive: false });
      elements.stage.addEventListener("touchcancel", handlePinchEnd, { passive: false });

      ["gesturestart", "gesturechange", "gestureend"].forEach((eventName) => {
        document.addEventListener(
          eventName,
          (event) => {
            event.preventDefault();
          },
          { passive: false }
        );
      });
      document.addEventListener("visibilitychange", () => {
        if (document.hidden) {
          stopCamera();
          setBootVisible(true);
          return;
        }

        if (hasBootSeen()) {
          setBootVisible(false);
          startCamera();
        } else {
          setBootVisible(true);
        }
      });
      window.addEventListener("pagehide", stopCamera);
      window.addEventListener("orientationchange", () => {
        void lockPortraitOrientation();
      });

      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("./sw.js").catch(() => {
            // Service worker registration is optional for the prototype.
          });
        });
      }

      if (hasBootSeen()) {
        setBootVisible(false);
        startCamera();
      } else {
        setBootVisible(true);
      }
      updateZoomUI();
    </script>
  </body>
</html>
